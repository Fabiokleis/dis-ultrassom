[project]
name = "dis-ultrassom"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.137.1",
    "numpy>=2.0.0",
    "python-multipart>=0.0.9",
    "pillow>=11.0.0",
    "requests>=2.34.2",
    "gradio>=6.18.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "ruff>=0.15.17",
]

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]


[tool.mypy]
plugins = [
    "pydantic.mypy"
]
strict = true
warn_return_any = true
warn_unused_configs = true


[tool.pytest.ini_options]
addopts = "-v --tb=short"
testpaths = ["tests"]
pythonpath = ["."]

[tool.fastapi]
entrypoint = "server.app:app"
